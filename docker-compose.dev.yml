version: '3.8'

services:
  mcp-server:
    build: .
    container_name: samsung-sdi-ems-server-dev
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=development
      - CORS_ORIGINS=*
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app  # 개발용: 코드 변경 시 자동 반영
      - ./data:/app/data
    restart: unless-stopped
    command: python mcp_server_flask.py  # 개발 모드로 실행

  # 개발용 Redis (선택사항)
  redis:
    image: redis:7-alpine
    container_name: mcp-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes

volumes:
  redis_dev_data: